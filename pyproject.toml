[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luaugen"
version = "0.1.0"
description = "Compile JSON data into deterministic Luau modules and verify them against reference cases."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]

[project.scripts]
luaugen = "luaugen.cli:main"

[tool.setuptools]
packages = ["luaugen"]
